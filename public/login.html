<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSH Client — Login</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 2rem;
      width: 320px;
    }
    .logo { text-align: center; font-size: 2rem; margin-bottom: 0.5rem; }
    h1 { text-align: center; font-size: 1.2rem; margin-bottom: 1.5rem; color: #e6edf3; }
    .error {
      display: none;
      background: #3d1a1a;
      border: 1px solid #ff7b72;
      color: #ff7b72;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    input[type=password] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }
    input[type=password]:focus { border-color: #58a6ff; }
    button {
      width: 100%;
      background: #238636;
      border: 1px solid #2ea043;
      border-radius: 4px;
      color: #fff;
      padding: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">⚔</div>
    <h1>MUSH Client</h1>
    <div class="error" id="error-msg">Incorrect password.</div>
    <form method="POST" action="/auth/login">
      <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
      <button type="submit">Enter</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
